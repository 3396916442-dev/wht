# ============================================================
# docker-compose.yml —— 本地开发环境
# 仅包含四个服务：mysql / redis / backend / frontend
# 后端 uvicorn --reload，前端 pnpm dev，均挂载源码实现热更新
# 不引入 Nginx / Kubernetes / 微服务等额外组件
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: quant-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quant_platform
      MYSQL_USER: quant_user
      MYSQL_PASSWORD: quant_password
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: quant-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: quant-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # 容器内服务名优先于 .env，避免本机 .env 写错导致跨容器失败
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: quant-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # 用匿名卷"屏蔽"宿主机 node_modules 与 .next，避免覆盖容器内安装结果
      - /app/node_modules
      - /app/.next

volumes:
  mysql_data:
  redis_data:
